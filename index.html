<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake Jungle</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🐍 Snake Jungle</h1>

<div id="topPanel">
<span id="statusText">Gotowy do gry</span>
<button onclick="resetGame()">Menu Główne</button>
</div>

<div id="modeSelect" class="menu-screen">
<h2>Wybierz tryb gry</h2>
<button onclick="chooseMode('solo')">Graj Sam</button>
<button onclick="chooseMode('bots')">Graj z Botami</button>
</div>

<div id="menu" class="menu-screen" style="display:none">

<div id="missionSection">
<h2>Misja</h2>
<select id="missionSelect">
<option value="big">Bądź największy</option>
<option value="small">Bądź najmniejszy</option>
<option value="survival">Przetrwanie (60s)</option>
</select>
</div>

<h2>Mapa</h2>
<select id="mapSelect">
<option value="jungle">Dżungla</option>
<option value="sky">Niebo</option>
<option value="desert">Pustynia</option>
</select>

<h2>Skin</h2>
<select id="skinSelect">
<option value="classic">Classic</option>
<option value="demogorgon">Demogorgon</option>
<option value="dog">Dog</option>
</select>

<button onclick="startGame()">START</button>

</div>

<canvas id="game" width="1000" height="700"></canvas>

<div id="controls">
    <button class="ctrl-btn" id="ctrl-up">UP</button>
    <div class="ctrl-row">
        <button class="ctrl-btn" id="ctrl-left">LEFT</button>
        <button class="ctrl-btn" id="ctrl-right">RIGHT</button>
    </div>
    <button class="ctrl-btn" id="ctrl-down">DOWN</button>
</div>

<script src="game.js"></script>

</body>
</html>
